services:
  db:
    image: postgres:16
    container_name: refunds-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refunds
    ports:
      - "5432:5432"
    volumes:
      - refunds-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d refunds"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  refunds-db-data:
